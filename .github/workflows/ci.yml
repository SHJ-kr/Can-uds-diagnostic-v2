name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

jobs:
  # 1) 코드 스타일 검사 (clang-format)
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clang-format 설치
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: 포맷 검사 (src/, include/ 안의 .c/.h 전부)
        run: |
          FILES=$(find src include -name "*.c" -o -name "*.h" 2>/dev/null)
          if [ -z "$FILES" ]; then
            echo "검사할 .c/.h 파일이 없습니다."
            exit 0
          fi
          clang-format --dry-run --Werror $FILES

  # 2) 커밋 메시지 컨벤션 검사
  commit-convention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 커밋 히스토리 전체를 받아야 범위 비교 가능
      - name: 이번 push로 새로 추가된 커밋들만 검사
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          bash scripts/check_commit_message.sh "$RANGE"

  # 3) 일반 정적분석 (cppcheck, MISRA는 로컬 pre-commit 훅에서 이미 검사하므로 여기선 범용 검사만 안전망으로 수행)
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cppcheck 설치
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: cppcheck 실행
        run: |
          FILES=$(find src -name "*.c" 2>/dev/null)
          if [ -z "$FILES" ]; then
            echo "검사할 .c 파일이 없습니다."
            exit 0
          fi
          cppcheck --enable=all --xml --xml-version=2 \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            --suppress=unusedFunction \
            -I include $FILES 2> cppcheck_report.xml
          # 이슈가 몇 건이든 이 job은 참고용이라 항상 성공 처리한다 (cppcheck 자체 동작에 암묵적으로 기대지 않음)
          exit 0
      - name: 결과 요약 (실패시키지 않음, 참고용)
        if: always()
        run: |
          if [ -s cppcheck_report.xml ]; then
            ISSUE_COUNT=$(grep -c '<error' cppcheck_report.xml || echo "0")
            echo "### Cppcheck 결과" >> $GITHUB_STEP_SUMMARY
            echo "**발견된 이슈: ${ISSUE_COUNT}건**" >> $GITHUB_STEP_SUMMARY
            grep -o 'severity="[^"]*"' cppcheck_report.xml | sort | uniq -c | while read count severity; do
              echo "- ${severity}: ${count}" >> $GITHUB_STEP_SUMMARY
            done || true
          fi
          exit 0
      - name: 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck_report.xml

  # 4) 동적 검증 (Google Test 빌드 및 실행)
  dynamic-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CMake 구성
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: 빌드
        run: cmake --build build
      - name: 테스트 실행
        run: ctest --test-dir build --output-on-failure